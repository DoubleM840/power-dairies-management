{% extends 'admin_app/base.html' %}
{% block page_title %}Edit User{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card-custom">
            <div class="card-header">
                <i class="fas fa-user-edit me-2"></i>Edit User: {{ edit_user.username }}
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ edit_user.first_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ edit_user.last_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ edit_user.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select" required>
                                <option value="admin" {% if edit_user.farmer_profile.role == 'admin' %}selected{% endif %}>Admin</option>
                                <option value="collector" {% if edit_user.farmer_profile.role == 'collector' %}selected{% endif %}>Collector</option>
                                <option value="farmer" {% if edit_user.farmer_profile.role == 'farmer' %}selected{% endif %}>Farmer</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ edit_user.farmer_profile.phone }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">{{ edit_user.farmer_profile.address }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary-custom text-white">
                            <i class="fas fa-save me-2"></i>Update User
                        </button>
                        <a href="{% url 'admin_app:manage_users' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
