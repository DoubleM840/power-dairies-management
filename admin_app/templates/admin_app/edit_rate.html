{% extends 'admin_app/base.html' %}
{% block page_title %}Edit Rate{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-custom">
            <div class="card-header"><i class="fas fa-edit me-2"></i>Edit Rate</div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Fat Rate (KES per Liter)</label>
                        <input type="number" name="fat_rate" class="form-control" value="{{ rate.fat_rate }}" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Commission Rate (%)</label>
                        <input type="number" name="commission_rate" class="form-control" value="{{ rate.commission_rate }}" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Effective Date</label>
                        <input type="date" name="effective_date" class="form-control" value="{{ rate.effective_date|date:'Y-m-d' }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom text-white">
                        <i class="fas fa-save me-2"></i>Update Rate
                    </button>
                    <a href="{% url 'admin_app:manage_rates' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
