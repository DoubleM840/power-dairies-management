<!-- Floating Chat Button -->
<div id="chat-widget" style="position:fixed;bottom:20px;right:20px;z-index:99999;font-family:'Segoe UI',sans-serif;">
    <button id="chat-toggle" style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 15px rgba(102,126,234,0.4);position:relative;">
        <i class="fas fa-comments"></i>
        <span id="chat-badge" style="position:absolute;top:-5px;right:-5px;background:#ff4757;color:white;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:bold;">1</span>
    </button>
    
    <!-- Chat Window -->
    <div id="chat-window" style="display:none;position:absolute;bottom:80px;right:0;width:380px;height:600px;background:white;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);flex-direction:column;overflow:hidden;">
        
        <!-- Header -->
        <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
            <div style="font-weight:600;font-size:16px;display:flex;align-items:center;">
                <i class="fas fa-robot" style="margin-right:8px;"></i>
                <span>Dairy Assistant</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
                <button id="new-chat-btn" title="New Chat" style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-plus"></i>
                </button>
                <button id="history-btn" title="Chat History" style="background:rgba(255,255,255,0.2);border:none;color:white;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fas fa-history"></i>
                </button>
                <button id="lang-toggle" title="Switch Language" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;">
                    <i class="fas fa-globe"></i> <span id="lang-text">EN</span>
                </button>
                <button id="chat-close" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">&times;</button>
            </div>
        </div>
        
        <!-- History Sidebar (hidden by default) -->
        <div id="chat-history-sidebar" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:white;z-index:10;flex-direction:column;">
            <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
                <h6 style="margin:0;font-size:15px;font-weight:600;"><i class="fas fa-history" style="margin-right:8px;"></i>Chat History</h6>
                <button id="close-history" style="background:rgba(255,255,255,0.2);border:none;color:white;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">&times;</button>
            </div>
            <div id="history-list" style="flex:1;overflow-y:auto;padding:12px;"></div>
        </div>
        
        <!-- Messages Area -->
        <div id="chat-messages" style="flex:1;overflow-y:auto;padding:16px;background:#f8f9fa;text-align:left !important;">
            <div class="chat-bot-msg" style="max-width:85%;padding:12px 16px;border-radius:16px;margin-bottom:12px;background:white;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.08);font-size:14px;line-height:1.5;text-align:left !important;float:none !important;clear:both !important;">
                Hello! 👋 I'm here to help with milk rates, feed orders, payments, and cow health. What would you like to know?
            </div>
            <div style="clear:both;"></div>
        </div>
        
        <!-- Image Preview -->
        <div id="image-preview-area" style="display:none;padding:10px 16px;background:#f8f9fa;border-top:1px solid #eee;flex-shrink:0;">
            <img id="preview-image" src="" alt="Preview" style="max-width:100%;max-height:100px;border-radius:8px;margin-bottom:8px;">
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button id="cancel-image" style="padding:6px 12px;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:12px;">Cancel</button>
                <button id="send-image" style="padding:6px 12px;border:none;border-radius:6px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;cursor:pointer;font-size:12px;">Analyze</button>
            </div>
        </div>
        
        <!-- Input Area -->
        <div style="padding:14px 16px;background:white;border-top:1px solid #e0e0e0;display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <label for="image-upload" title="Upload cow photo" style="width:38px;height:38px;border-radius:50%;background:#f0f2f5;color:#667eea;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px;">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="image-upload" accept="image/*" style="display:none;">
            <input type="text" id="chat-input" placeholder="Type your question..." autocomplete="off" style="flex:1;border:1.5px solid #ddd;border-radius:24px;padding:10px 18px;font-size:14px;outline:none;min-width:0;">
            <button id="chat-send" style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';
    
    // Wait for DOM
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initChat);
    } else {
        initChat();
    }
    
    function initChat() {
        const chatToggle = document.getElementById('chat-toggle');
        const chatWindow = document.getElementById('chat-window');
        const chatClose = document.getElementById('chat-close');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatMessages = document.getElementById('chat-messages');
        const chatBadge = document.getElementById('chat-badge');
        const langToggle = document.getElementById('lang-toggle');
        const langText = document.getElementById('lang-text');
        const newChatBtn = document.getElementById('new-chat-btn');
        const historyBtn = document.getElementById('history-btn');
        const historySidebar = document.getElementById('chat-history-sidebar');
        const historyList = document.getElementById('history-list');
        const closeHistoryBtn = document.getElementById('close-history');
        const imageUpload = document.getElementById('image-upload');
        const previewArea = document.getElementById('image-preview-area');
        const previewImage = document.getElementById('preview-image');
        const sendImageBtn = document.getElementById('send-image');
        const cancelImageBtn = document.getElementById('cancel-image');
        
        let selectedImageFile = null;
        let currentLanguage = 'en';
        let currentSessionId = null;
        
        // Toggle chat window
        chatToggle.addEventListener('click', function() {
            if (chatWindow.style.display === 'none' || chatWindow.style.display === '') {
                chatWindow.style.display = 'flex';
                chatBadge.style.display = 'none';
                setTimeout(function() { chatInput.focus(); scrollToBottom(); }, 100);
            } else {
                chatWindow.style.display = 'none';
            }
        });
        
        chatClose.addEventListener('click', function() {
            chatWindow.style.display = 'none';
        });
        
        // New Chat
        newChatBtn.addEventListener('click', function() {
            if (confirm('Start a new conversation?')) {
                currentSessionId = null;
                chatMessages.innerHTML = '<div class="chat-bot-msg" style="max-width:85%;padding:12px 16px;border-radius:16px;margin-bottom:12px;background:white;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.08);font-size:14px;line-height:1.5;text-align:left !important;">Hello! 👋 I\'m here to help with milk rates, feed orders, payments, and cow health. What would you like to know?</div><div style="clear:both;"></div>';
                historySidebar.style.display = 'none';
                scrollToBottom();
            }
        });
        
        // Toggle History Sidebar
        historyBtn.addEventListener('click', function() {
            loadChatHistory();
            historySidebar.style.display = 'flex';
        });
        
        closeHistoryBtn.addEventListener('click', function() {
            historySidebar.style.display = 'none';
        });
        
        // Language toggle - JUST change the button, no message!
        langToggle.addEventListener('click', function() {
            currentLanguage = currentLanguage === 'en' ? 'sw' : 'en';
            langText.textContent = currentLanguage === 'en' ? 'EN' : 'SW';
            // That's it! No API call, no message added.
        });
        
        // Image upload
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedImageFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewArea.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        cancelImageBtn.addEventListener('click', function() {
            previewArea.style.display = 'none';
            imageUpload.value = '';
            selectedImageFile = null;
        });

        sendImageBtn.addEventListener('click', function() {
            if (!selectedImageFile) return;
            const formData = new FormData();
            formData.append('image', selectedImageFile);
            addMessage('Analyzing cow health from image...', 'user');
            const typingId = showTyping();
            scrollToBottom();
            fetch('/api/analyze-image/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                removeTyping(typingId);
                if (data.analysis) {
                    addMessage(data.analysis, 'bot', true);
                } else {
                    addMessage('Sorry, analysis failed.', 'bot');
                }
                previewArea.style.display = 'none';
                imageUpload.value = '';
                selectedImageFile = null;
                scrollToBottom();
            })
            .catch(function() {
                removeTyping(typingId);
                addMessage('Error uploading image.', 'bot');
                previewArea.style.display = 'none';
                imageUpload.value = '';
                selectedImageFile = null;
                scrollToBottom();
            });
        });
        
        // Send message
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            chatInput.value = '';
            chatSend.disabled = true;
            scrollToBottom();
            const typingId = showTyping();
            fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ 
                    message: message,
                    language: currentLanguage,
                    session_id: currentSessionId
                })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                removeTyping(typingId);
                if (data.session_id) currentSessionId = data.session_id;
                addMessage(data.response, 'bot', true);
                chatSend.disabled = false;
                scrollToBottom();
            })
            .catch(function() {
                removeTyping(typingId);
                addMessage('Sorry, connection error.', 'bot');
                chatSend.disabled = false;
                scrollToBottom();
            });
        }
        
        function addMessage(text, sender, isHtml) {
            const div = document.createElement('div');
            div.style.cssText = 'max-width:85%;padding:12px 16px;border-radius:16px;margin-bottom:12px;font-size:14px;line-height:1.5;text-align:left !important;float:none !important;clear:both !important;';
            if (sender === 'bot') {
                div.style.background = 'white';
                div.style.color = '#333';
                div.style.borderBottomLeftRadius = '4px';
                div.style.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';
            } else {
                div.style.background = 'linear-gradient(135deg,#667eea 0%,#764ba2 100%)';
                div.style.color = 'white';
                div.style.marginLeft = 'auto';
                div.style.borderBottomRightRadius = '4px';
            }
            if (isHtml) {
                div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            } else {
                div.textContent = text;
            }
            chatMessages.appendChild(div);
            const clearDiv = document.createElement('div');
            clearDiv.style.clear = 'both';
            chatMessages.appendChild(clearDiv);
            scrollToBottom();
        }
        
        function scrollToBottom() {
            setTimeout(function() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 50);
        }
        
        function showTyping() {
            const div = document.createElement('div');
            div.style.cssText = 'padding:12px 16px;background:white;border-radius:16px;border-bottom-left-radius:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:inline-block;';
            div.id = 'typing-' + Date.now();
            div.innerHTML = '<span style="display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;margin:0 2px;animation:chatTyping 1.4s infinite;"></span><span style="display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;margin:0 2px;animation:chatTyping 1.4s infinite 0.2s;"></span><span style="display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;margin:0 2px;animation:chatTyping 1.4s infinite 0.4s;"></span>';
            chatMessages.appendChild(div);
            scrollToBottom();
            return div.id;
        }
        
        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        function loadChatHistory() {
            fetch('/api/chat-history/')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.history && data.history.length > 0) {
                        let html = '';
                        data.history.forEach(function(session) {
                            html += '<div class="history-item" style="padding:12px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid #e0e0e0;position:relative;" onclick="loadChatSession(' + session.id + ')"><span style="position:absolute;top:12px;right:12px;color:#ff4757;cursor:pointer;" onclick="event.stopPropagation();deleteChatSession(' + session.id + ')"><i class="fas fa-trash"></i></span><div style="font-weight:600;font-size:13px;color:#333;margin-bottom:4px;padding-right:25px;">' + escapeHtml(session.title) + '</div><div style="font-size:11px;color:#666;"><i class="far fa-clock"></i> ' + session.created_at + ' • ' + session.message_count + ' messages</div></div>';
                        });
                        historyList.innerHTML = html;
                    } else {
                        historyList.innerHTML = '<div style="text-align:center;color:#999;padding:20px;"><i class="fas fa-inbox"></i> No chat history yet</div>';
                    }
                })
                .catch(function() {
                    historyList.innerHTML = '<div style="text-align:center;color:#ff4757;padding:20px;">Failed to load history</div>';
                });
        }
        
        window.loadChatSession = function(sessionId) {
            fetch('/api/load-chat/' + sessionId + '/')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    currentSessionId = data.session_id;
                    chatMessages.innerHTML = '';
                    data.messages.forEach(function(msg) {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', true);
                    });
                    historySidebar.style.display = 'none';
                    scrollToBottom();
                })
                .catch(function() { alert('Failed to load chat session'); });
        };
        
        window.deleteChatSession = function(sessionId) {
            if (confirm('Delete this chat session?')) {
                fetch('/api/delete-chat/' + sessionId + '/', {
                    method: 'DELETE',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.success) loadChatHistory();
                })
                .catch(function() { alert('Failed to delete session'); });
            }
        };
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        chatSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Add typing animation
        if (!document.getElementById('chat-typing-style')) {
            const style = document.createElement('style');
            style.id = 'chat-typing-style';
            style.textContent = '@keyframes chatTyping{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}';
            document.head.appendChild(style);
        }
    }
})();
</script>
