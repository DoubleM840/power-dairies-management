services:
  - type: web
    name: power-dairies
    env: python
    region: oregon           # closest free region; change to frankfurt if preferred
    plan: free
    repo: https://github.com/DoubleM840/power-dairies-management

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py setup_initial_data

    startCommand: gunicorn dairy_management.wsgi:application

    envVars:
      # Django core
      - key: DJANGO_SETTINGS_MODULE
        value: dairy_management.settings

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random key

      # Render injects this automatically when you link the database below
      - key: DATABASE_URL
        fromDatabase:
          name: power-dairies-db
          property: connectionString

      # Your Render URL — set after first deploy, e.g.:
      # https://power-dairies.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://power-dairies.onrender.com

      # M-Pesa — fill in real values in Render dashboard
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false                  # set manually in Render dashboard
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://power-dairies.onrender.com/mpesa/callback/
      - key: MPESA_ACCOUNT_REFERENCE
        value: Power Dairies
      - key: MPESA_TRANSACTION_DESC
        value: Payment for feed order

      # Groq AI
      - key: GROQ_API_KEY
        sync: false                  # set manually in Render dashboard

databases:
  - name: power-dairies-db
    plan: free
    region: oregon
