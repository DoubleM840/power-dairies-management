{% extends 'farmer_app/base.html' %}
{% block page_title %}Edit Cow - {{ cow.tag }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-custom">
            <div class="card-header"><i class="fas fa-edit me-2"></i>Edit: {{ cow.name|default:cow.tag }}</div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ cow.name }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Breed Type</label>
                        <select name="breed_type" class="form-select">
                            {% for value, label in cow.BREED_CHOICES %}
                            <option value="{{ value }}" {% if cow.breed_type == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Age (months)</label>
                        <input type="number" name="age_months" class="form-control" value="{{ cow.age_months }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Health Status</label>
                        <select name="health_status" class="form-select">
                            {% for value, label in cow.HEALTH_STATUS %}
                            <option value="{{ value }}" {% if cow.health_status == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary-custom text-white">
                        <i class="fas fa-save me-2"></i>Update
                    </button>
                    <a href="{% url 'farmer_app:livestock_management' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
