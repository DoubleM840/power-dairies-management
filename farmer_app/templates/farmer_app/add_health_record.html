{% extends 'farmer_app/base.html' %}
{% block page_title %}Add Health Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-custom">
            <div class="card-header"><i class="fas fa-heartbeat me-2"></i>Add Health Record for {{ cow.tag }}</div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Treatment</label>
                        <textarea name="treatment" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vet Name</label>
                        <input type="text" name="vet_name" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary-custom text-white">
                        <i class="fas fa-save me-2"></i>Save Record
                    </button>
                    <a href="{% url 'farmer_app:health_history' cow.id %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
